<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maze Chase</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; }
body { display:flex; justify-content:center; align-items:center; font-family:monospace; color:#fff; }
canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
#ui { position:absolute; top:10px; left:50%; transform:translateX(-50%); text-align:center; z-index:10; font-size:18px; text-shadow:0 0 4px #000; pointer-events:none; }
#gameover { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#000e; padding:40px; text-align:center; z-index:20; border:2px solid #fff; }
#gameover button { margin-top:20px; padding:10px 30px; font-size:16px; cursor:pointer; background:#222; color:#fff; border:1px solid #fff; }
</style>
</head>
<body>
<div id="ui">Score: <span id="score">0</span> | Lives: <span id="lives">♥♥♥</span></div>
<canvas id="c"></canvas>
<div id="gameover">
<h2 id="goTitle">GAME OVER</h2>
<p>Score: <span id="finalScore">0</span></p>
<button onclick="restartGame()">Play Again</button>
</div>
<script type="module" src="src/game.js"></script>
</body>
</html>
