<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Chase</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
canvas {
  border: 2px solid #2244aa;
  image-rendering: pixelated;
}
#ui {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-size: 18px;
  text-align: center;
  z-index: 10;
}
#score { color: #ffcc00; }
#lives { color: #ff4444; }
#level { color: #44ff44; }
#message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  font-size: 32px;
  text-align: center;
  z-index: 20;
  display: none;
}
#controls {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: #888;
  font-size: 12px;
  z-index: 10;
}
</style>
</head>
<body>
<div id="ui">
  <span id="score">Score: 0</span> | 
  <span id="lives">Lives: 3</span> | 
  <span id="level">Level: 1</span>
</div>
<canvas id="game"></canvas>
<div id="message"></div>
<div id="controls">Arrow keys / WASD to move | SPACE to pause</div>
<script src="src/game.js"></script>
</body>
</html>
