<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Maze Chase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #container {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%; height: 100%;
    position: relative;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    max-width: 100vw;
    max-height: calc(100vh - 80px);
  }
  #hud {
    position: absolute; top: 4px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    color: #fff; font-size: 16px;
    padding: 4px 12px;
    z-index: 10;
    pointer-events: none;
  }
  #startScreen, #gameOverScreen {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.92);
    z-index: 20;
    color: #fff;
  }
  #startScreen h1 {
    font-size: 36px; color: #ffcc00;
    margin-bottom: 12px; text-align: center;
    text-shadow: 2px 2px 4px rgba(255,204,0,0.5);
  }
  #startScreen p, #gameOverScreen p {
    font-size: 14px; margin: 6px 0;
    color: #aaa;
  }
  #startScreen .play-btn,
  #gameOverScreen .retry-btn {
    margin-top: 20px;
    padding: 14px 40px;
    font-size: 20px;
    background: #ffcc00; color: #000;
    border: none; border-radius: 8px;
    cursor: pointer; font-weight: bold;
    font-family: 'Courier New', monospace;
  }
  #startScreen .play-btn:hover,
  #gameOverScreen .retry-btn:hover {
    background: #ffe066;
  }
  #gameOverScreen h2 {
    font-size: 32px; color: #ff4444;
    margin-bottom: 8px;
  }
  #gameOverScreen .final-score {
    font-size: 24px; color: #ffcc00;
    margin-bottom: 16px;
  }
  #mobileControls {
    position: absolute; bottom: 8px;
    width: 100%; display: none;
    justify-content: center; z-index: 15;
  }
  .dpad-row {
    display: flex; align-items: center;
    justify-content: center; gap: 4px;
    margin: 2px 0;
  }
  .dpad-btn {
    width: 56px; height: 56px;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 10px; color: #fff;
    font-size: 24px; cursor: pointer;
    display: flex; align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn:active {
    background: rgba(255,204,0,0.4);
  }
  .dpad-spacer { width: 56px; height: 56px; }

  @media (pointer: coarse) {
    #mobileControls { display: flex; }
  }
</style>
</head>
<body>
<div id="container">
  <div id="hud">
    <span id="scoreDisplay">Score: 0</span>
    <span id="livesDisplay">Lives: 3</span>
    <span id="levelDisplay">Level: 1</span>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="startScreen">
    <h1>🏰 Maze Chase</h1>
    <p>Collect all dots to advance</p>
    <p>Avoid the ghosts!</p>
    <button class="play-btn" id="playBtn">PLAY</button>
    <p style="margin-top:12px;font-size:12px;">Arrow keys / WASD / Touch to move</p>
  </div>
  <div id="gameOverScreen" style="display:none;">
    <h2>GAME OVER</h2>
    <div class="final-score" id="finalScore">0</div>
    <button class="retry-btn" id="retryBtn">PLAY AGAIN</button>
  </div>
  <div id="mobileControls">
    <div class="dpad-row">
      <div class="dpad-spacer"></div>
      <div class="dpad-btn" data-dir="up">▲</div>
      <div class="dpad-spacer"></div>
    </div>
    <div class="dpad-row">
      <div class="dpad-btn" data-dir="left">◀</div>
      <div class="dpad-btn" data-dir="down">▼</div>
      <div class="dpad-btn" data-dir="right">▶</div>
    </div>
  </div>
</div>
<script src="src/config.js"></script>
<script src="src/maze.js"></script>
<script src="src/pacman.js"></script>
<script src="src/ghosts.js"></script>
<script src="src/input.js"></script>
<script src="src/game.js"></script>
</body>
</html>
